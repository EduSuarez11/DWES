<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .login-container {
            max-width: 400px;
            margin-top: 10%;
            padding: 2rem;
            border-radius: 1rem;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="login-container">
        <h2 class="text-center mb-4">Iniciar Sesión en el simulacro</h2>

        <!--  Params  -->
        <div th:if="${param.error}" class="alert alert-danger text-center" th:text="${'Error al iniciar sesión'}"></div>
        <div th:if="${param.logout}" class="alert alert-success text-center" th:text="${'Has cerrado sesión con éxito'}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="d-flex justify-content-around gap-2">
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
                <a th:href="@{/}" class="btn btn-secondary w-100">Volver</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
