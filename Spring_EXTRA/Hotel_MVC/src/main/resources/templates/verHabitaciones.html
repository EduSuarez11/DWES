<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Habitaciones')}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>
<div class="container mt-5 mb-5" style="height: 80vh;">
    <h2 class="mb-4">Habitaciones disponibles</h2>

    <!-- Mensajes flash -->
    <div th:if="${msg}" class="alert alert-success text-center" th:text="${msg}"></div>
    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(habitaciones)}">
        <p class="text-muted">No hay habitaciones disponibles.</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:if="${!#lists.isEmpty(habitaciones)}">
        <div class="col" th:each="habitacion : ${habitaciones}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="'Habitación ' + ${habitacion.codigo}">Código</h5>
                    <p class="card-text">
                        <strong>Tamaño:</strong> <span th:text="${habitacion.tamano} + ' m²'">20 m²</span><br>
                        <strong>Doble:</strong> <span th:text="${habitacion.doble} ? 'Sí' : 'No'">Sí/No</span><br>
                        <strong>Precio por noche:</strong> <span th:text="${habitacion.precioNoche} + ' €'">0.0 €</span><br>
                        <strong>Incluye desayuno:</strong> <span th:text="${habitacion.incluyeDesayuno} ? 'Sí' : 'No'">Sí/No</span><br>
                        <strong>Ocupada:</strong> <span th:class="${habitacion.ocupada ? 'text-danger' : 'text-success'}" th:text="${habitacion.ocupada} ? 'Sí' : 'No'">Sí/No</span>
                    </p>

                    <!-- Solo mostrar el botón si el usuario es ADMIN -->
                    <div class="d-flex justify-content-between" >
                        <form th:action="@{/habitaciones/eliminar}" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" method="post">
                            <input type="hidden" name="codigo" th:value="${habitacion.codigo}" />
                            <input type="hidden" name="hotelCodigo" th:value="${habitacion.codigoHotel}" />
                            <button class="btn btn-danger btn-sm mt-2">Eliminar</button>
                        </form>

                        <form th:action="@{/habitaciones/ocupar}" th:if="${#authorization.expression('hasRole(''USER'')')}" method="post">
                            <input type="hidden" name="codigo" th:value="${habitacion.codigo}" />
                            <input type="hidden" name="hotelCodigo" th:value="${habitacion.codigoHotel}" />
                            <button class="btn btn-primary btn-sm mt-2">Reservar habitación</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/hoteles/buscar}" class="btn btn-secondary">Volver a Hoteles</a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
