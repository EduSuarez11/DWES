<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{fragments/head :: head('ReservaTuHotel')}"></head>

<body>

<main class="container py-5">
    <div class="row justify-content-center align-items-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
            <!-- =================================================
                 TARJETA DE REGISTRO
                 ================================================= -->

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <!-- Título -->
                    <div class="text-center mb-4">
                        <span class="badge bg-dark px-3 py-2 mb-3">ReservaTuHotel</span>
                        <h1 class="h3 fw-bold mb-2">Crear una cuenta</h1>
                        <p class="text-secondary mb-0">Regístrate para acceder a nuestra plataforma de gestión hotelera.</p>
                    </div>


                    <!-- =================================================
                         FORMULARIO
                         ================================================= -->
                    <form th:action="@{/auth/register}" th:object="${userRegister}" method="post">
                        <!-- Nombre -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre completo</label>

                            <input  type="text" class="form-control form-control-lg" id="nombre" name="nombre" placeholder="Introduce tu nombre"
                                    autocomplete="name" maxlength="100" required th:field="*{fullName}"/>

                            <div th:if="${#fields.errors('fullName')}" th:errors="*{fullName}" class="text-small text-danger"></div>
                        </div>

                        <!-- Username -->
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Nombre de usuario</label>

                            <input type="text" class="form-control form-control-lg" id="username"
                                    name="username" placeholder="Elige un nombre de usuario" autocomplete="username"
                                    maxlength="50" required th:field="*{username}" />

                            <div class="text-small text-danger" th:if="${#fields.errors('username')}" th:errors="*{username}"></div>
                        </div>


                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Correo electrónico</label>

                            <input type="email" class="form-control form-control-lg" id="email"
                                    name="email" placeholder="ejemplo@correo.com" autocomplete="email"
                                    required th:fields="*{email}" />

                            <div class="text-small text-danger" th:if="${#fields.errors('email')}" th:errors="*{email}"></div>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Contraseña</label>

                            <input type="password" class="form-control form-control-lg" id="password" name="password"
                                    placeholder="Introduce tu contraseña" autocomplete="new-password" minlength="8"
                                    required th:field="*{password}" />

                            <div class="text-small text-danger" th:if="${#fields.errors('password')}" th:errors="*{password}"></div>
                        </div>


                        <!-- Botón de registro -->
                        <div class="d-grid mb-4">

                            <button type="submit" class="btn btn-dark btn-lg">Crear cuenta</button>

                        </div>


                        <!-- Acceso al login -->
                        <div class="text-center">

                            <span class="text-secondary">¿Ya tienes una cuenta?</span>

                            <a th:href="@{/login}" class="text-decoration-none fw-semibold link-dark ms-1">
                                Inicia sesión
                            </a>

                        </div>

                    </form>

                </div>

            </div>

            <!-- =================================================
                 INFORMACIÓN INFERIOR
                 ================================================= -->

            <div class="text-center mt-4">

                <a href="/" class="text-decoration-none text-secondary small">
                    Volver a la página de inicio
                </a>

            </div>

        </div>
    </div>
</main>

</body>

</html>
